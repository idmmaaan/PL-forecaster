[tool.uv.workspace]
members = ["apps/api", "ml"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests>=2.32",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/api/alembic/versions", "ml/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# B008 conflicts with the FastAPI Depends()-in-defaults idiom.
ignore = ["B008", "SIM108"]

[tool.ruff.lint.isort]
# Both are workspace packages, so they belong in the first-party import group.
known-first-party = ["app", "epl_predictor"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["apps/api/alembic/versions/", "^build/"]

[[tool.mypy.overrides]]
module = ["tests.*", "ml.tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "ml/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# importlib mode keeps the two test trees independent: neither needs an
# __init__.py, and test file names may repeat across apps/api and ml.
addopts = "-q --import-mode=importlib"
filterwarnings = [
    "error::DeprecationWarning:app.*",
    "error::DeprecationWarning:epl_predictor.*",
]
