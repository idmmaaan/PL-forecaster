name: epl-ai-predictor

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: epl_predictor
      POSTGRES_USER: epl
      POSTGRES_PASSWORD: epl
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epl -d epl_predictor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: