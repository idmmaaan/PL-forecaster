# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library that can be
# installed by adding `alembic[tz]` to the pip requirements
# timezone =

# max length of characters to apply to the
# "slug" field
# max_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version path separator; As mentioned above, this is the character used to split 
# version_locations. The default within new alembic.ini files is "os.sep", which 
# means it will use the os.pathsep. For cross-platform projects this can cause 
# inconsistencies, so we recommend setting this explicitly.
version_path_separator = os.sep

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

# Overridden at runtime by alembic/env.py from DATABASE_URL / app settings.
# The placeholder is only here so `alembic` can start without an environment.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Newly generated revisions are formatted and import-sorted with Ruff, which is
# the project's formatter. (The default template's `black` hook is not used
# because black is not a project dependency.)
hooks = ruff_format,ruff_fix
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = console_scripts
ruff_fix.entrypoint = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

# name of files that should be ignored when generating revisions
# ignore_versions = .gitignore


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
# "level = INFO" logs SQL queries.
# "level = DEBUG" logs SQL queries and results.
# "level = WARNING" logs neither.

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S