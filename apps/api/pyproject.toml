[project]
name = "api"
version = "0.1.0"
description = "EPL AI Predictor API"
authors = [
    { name = "EPL AI Predictor Team" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.38",
    "psycopg[binary]>=3.2.4",
    "alembic>=1.14.0",
    "aiohttp>=3.10.0",
    "epl-predictor",
]

[tool.uv.sources]
epl-predictor = { workspace = true }

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
